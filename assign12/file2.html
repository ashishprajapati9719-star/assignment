
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Design</title>

    <style>
        .card {
            background-color: lightblue;
            border: 2px solid navy;
            border-radius: 12px;
            padding: 16px;
            width: 300px;
        }
    </style>
</head>
<body>

    <h2>My Card</h2>

    <div class="card">
        <h3>Welcome to CSS</h3>
        <p>
            CSS is used to style web pages.
            It controls colours, borders, spacing and layouts.
        </p>
    </div>

</body>
</html>
