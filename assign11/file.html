
<!DOCTYPE html>
<html>
<head>
    <title>CSS Units</title>

    <style>
        .box1 {
            width: 200px;
            height: 40px;
            background-color: lightblue;
            margin-bottom: 10px;
        }

        .box2 {
            width: 50%;
            height: 40px;
            background-color: lightgreen;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>CSS Units Example</h1>

    <div class="box1">200px Box</div>

    <div class="box2">50% Width Box</div>

    <p>This paragraph uses 1.5rem font size.</p>

</body>
</html>
