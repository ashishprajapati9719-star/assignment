
<!DOCTYPE html>
<html>
<head>
    <title>Required Sign Up Form</title>
</head>
<body>

    <h1>Registration Form</h1>

    <form>

        <label for="fullname">Full Name:</label>
        <input type="text"
               id="fullname"
               name="fullname"
               placeholder="Enter your full name"
               required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               name="email"
               required>

        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
